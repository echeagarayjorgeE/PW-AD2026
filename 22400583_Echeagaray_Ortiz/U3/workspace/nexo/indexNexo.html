<!DOCTYPE html>
<html lang="es">

</html>

<head>
    <meta charset="UTF-8">
    <title>Nexo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="contenedor">
        <section class="panel-login">
            <div class="tarjeta">
                <img class="logo" src="./logoNexo.pg">
                <h2>Buenos dias</h2>
                <p>Ingresa tus crendenciales para continuar</p>
            </div>
            <div class="campo">
                <label>Usuario</label>
                <div class="input-contenedor">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
                    </svg>
                    <input TYPE="TEXT" placeholder="Ingresa tu usuario">
                </div>

                <label>Contraseña</label>
                <div class="input-contenedor">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>

                    <input TYPE="password" placeholder="Ingresa tu contraseña">
                </div>
                <button>
                    Ingresar
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-arrow-right w-5 h-5 group-hover:translate-x-1 transition-transform duration-200"
                        aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>

                </button>
                <p class="recuperar">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </p>
                <footer>
                    <P>
                        Consulta nuestro Aviso de Privacidad
                        <a href="https://www.tecnm.mx/avisos-de-privacidad.html" target="_blank">aquí</a>
                    </P>
                </footer>
            </div>
        </section>

        <section class="panel-institucional">
            <div class="contenido-institucional">
                <img src="./logosTec.png" alt="Logo del ITT">
                <h2>Bienvenido al sistema NEXO</h2>
                <p>
                    Tu plataforma integral de servicios academicos del ITT
                </p>
        </section>

    </main>
</body>
