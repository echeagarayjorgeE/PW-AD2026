<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="UTF-8" />
    <title>Google</title>
    <link rel="stylesheet" href="css/stylesGoogle.css">
</head>

<body>
    <header>
        <nav class="nav-top">
            <ul>
                <li>
                    <a href="#">Gmail</a>
                </li>
                <li>
                    <a href="#">Imagenes</a>
                </li>
                <li>
                    <a href="#" class="btn-login">Acceder</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <h1 id="google-logo" aria-label="Google">
            <span class="g1">G</span>
            <span class="o1">O</span>
            <span class="o2">O</span>
            <span class="g2">G</span>
            <span class="l1">L</span>
            <span class="e1">E</span>
        </h1>
        <div class="search-container">
            <textarea class="search-input" rows="1" placeholder="Ingresa una busqueda...">
            </textarea>
        </div>
        <div class="buttons">
            <button class="btn-search">Buscar con Google</button>
            <button class="btn-lucky">Me siento con suerte</button>

        </div>

    </main>


    <footer>
        <p class="country">México</p>
        <div class="footer-links">
            <ul class="left-links">
                <li>
                    <a href="#">Sobre Google</a>
                </li>
                <li>
                    <a href="#">Publicidad</a>
                </li>
                <li>
                    <a href="#">Negocios</a>
                </li>
            </ul>
            <ul class="right-links">
                <li>
                    <a href="#">Privacidad</a>
                </li>
                <li>
                    <a href="#">Condiciones</a>
                </li>
                <li>
                    <a href="#">Configuración</a>
                </li>
            </ul>
        </div>
    </footer>
</body>

</html>
